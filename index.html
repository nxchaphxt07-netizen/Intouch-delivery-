<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหารออนไลน์ - Intouch Delivery</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ข้อมูลรายการอาหารตัวอย่าง
    const MENU_ITEMS = [
      { id: 1, name: 'กะเพราหมูสับไข่ดาว', category: 'จานเดี่ยว', price: 65, image: 'https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=400', spicy: true },
      { id: 2, name: 'ข้าวผัดต้มยำกุ้ง', category: 'จานเดี่ยว', price: 89, image: 'https://images.unsplash.com/photo-1559847844-5315695dadae?w=400', spicy: true },
      { id: 3, name: 'ข้าวหมูกระเทียม', category: 'จานเดี่ยว', price: 60, image: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400', spicy: false },
      { id: 4, name: 'ชาไทยเย็น', category: 'เครื่องดื่ม', price: 35, image: 'https://images.unsplash.com/photo-1558857563-b371033873b8?w=400', spicy: false },
      { id: 5, name: 'ชามะนาว', category: 'เครื่องดื่ม', price: 35, image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400', spicy: false },
    ];

    function App() {
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('ทั้งหมด');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [notes, setNotes] = useState('');

      const categories = ['ทั้งหมด', 'จานเดี่ยว', 'เครื่องดื่ม'];

      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // สร้างข้อความสรุปรายการสั่งซื้อสำหรับส่งเข้า LINE
      const sendOrderToLine = () => {
        if (cart.length === 0) return;
        let text = "🛒 *ออเดอร์ใหม่จากหน้าเว็บ*\n\n";
        cart.forEach((item, index) => {
          text += `${index + 1}. ${item.name} x${item.qty} = ${item.price * item.qty} บาท\n`;
        });
        text += `\n💰 *ยอดรวมทั้งหมด: ${totalAmount} บาท*`;
        if (notes) text += `\n📝 *หมายเหตุ:* ${notes}`;
        
        // ก๊อปปี้ข้อความ และเปิดไปยัง LINE
        navigator.clipboard.writeText(text);
        alert("คัดลอกข้อความออเดอร์เรียบร้อยแล้ว! กำลังเปิด LINE เพื่อวางส่งออเดอร์ให้ร้านค้า");
        window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
      };

      return (
        <div class="min-h-screen pb-24">
          <!-- Header -->
          <header class="bg-emerald-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
            <div>
              <h1 class="text-xl font-bold">Intouch Delivery</h1>
              <p class="text-xs text-emerald-100">สั่งสดง่ายๆ จัดส่งถึงหน้าบ้าน</p>
            </div>
            <button onClick={() => setIsCartOpen(true)} class="relative bg-emerald-700 p-2 rounded-full">
              🛒
              {cart.length > 0 && (
                <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
                  {cart.reduce((a, b) => a + b.qty, 0)}
                </span>
              )}
            </button>
          </header>

          <!-- Category Filter -->
          <div class="flex gap-2 p-4 overflow-x-auto bg-white border-b">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setSelectedCategory(cat)}
                class={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap ${
                  selectedCategory === cat ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-600'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          <!-- Menu Grid -->
          <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
            {MENU_ITEMS
              .filter(item => selectedCategory === 'ทั้งหมด' || item.category === selectedCategory)
              .map(item => (
                <div key={item.id} class="bg-white p-3 rounded-xl shadow-sm border flex gap-3 items-center">
                  <img src={item.image} alt={item.name} class="w-20 h-20 rounded-lg object-cover" />
                  <div class="flex-1">
                    <h3 class="font-bold text-gray-800">{item.name}</h3>
                    <p class="text-emerald-600 font-bold mt-1">{item.price} ฿</p>
                  </div>
                  <button
                    onClick={() => addToCart(item)}
                    class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-emerald-700"
                  >
                    + เพิ่ม
                  </button>
                </div>
            ))}
          </div>

          <!-- Cart Bottom Bar -->
          {cart.length > 0 && (
            <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-2xl mx-auto">
              <div>
                <p class="text-xs text-gray-500">รวมทั้งหมด ({cart.reduce((a, b) => a + b.qty, 0)} รายการ)</p>
                <p class="text-xl font-bold text-emerald-600">{totalAmount} ฿</p>
              </div>
              <button
                onClick={() => setIsCartOpen(true)}
                class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-emerald-700"
              >
                ดูตะกร้าสินค้า 🛒
              </button>
            </div>
          )}

          <!-- Cart Modal Drawer -->
          {isCartOpen && (
            <div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end">
              <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-4">
                <div>
                  <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h2 class="text-lg font-bold">ตะกร้าของคุณ</h2>
                    <button onClick={() => setIsCartOpen(false)} class="text-gray-500 text-xl font-bold">✕</button>
                  </div>

                  <div class="space-y-3 max-h-[50vh] overflow-y-auto">
                    {cart.map(item => (
                      <div key={item.id} class="flex justify-between items-center border-b pb-2">
                        <div>
                          <p class="font-semibold">{item.name}</p>
                          <p class="text-sm text-gray-500">{item.price * item.qty} ฿</p>
                        </div>
                        <div class="flex items-center gap-2">
                          <button onClick={() => updateQty(item.id, -1)} class="w-7 h-7 bg-gray-200 rounded-full font-bold">-</button>
                          <span>{item.qty}</span>
                          <button onClick={() => updateQty(item.id, 1)} class="w-7 h-7 bg-emerald-600 text-white rounded-full font-bold">+</button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div class="mt-4">
                    <label class="text-xs font-semibold text-gray-600 block mb-1">หมายเหตุเพิ่มเติม (ถ้ามี):</label>
                    <textarea
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      placeholder="เช่น เผ็ดน้อย, แยกน้ำ, ไม่ใส่ผัก"
                      class="w-full border rounded-lg p-2 text-sm"
                      rows="2"
                    ></textarea>
                  </div>
                </div>

                <div class="border-t pt-4">
                  <div class="flex justify-between text-lg font-bold mb-4">
                    <span>ยอดชำระสุทธิ:</span>
                    <span class="text-emerald-600">{totalAmount} ฿</span>
                  </div>
                  <button
                    onClick={sendOrderToLine}
                    class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-center block shadow-md hover:bg-emerald-600"
                  >
                    ส่งรายการสั่งอาหารไปทาง LINE 🟢
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
