<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหารออนไลน์ - Intouch Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

  <!-- Header -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Intouch Delivery</h1>
      <p class="text-xs text-emerald-100">สั่งสดง่ายๆ จัดส่งถึงหน้าบ้าน</p>
    </div>
    <button onclick="openCart()" class="relative bg-emerald-700 p-2 rounded-full text-lg">
      🛒 <span id="cart-count-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
    </button>
  </header>

  <!-- Category Filter -->
  <div class="flex gap-2 p-4 overflow-x-auto bg-white border-b">
    <button onclick="filterCategory('ทั้งหมด')" class="cat-btn bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">ทั้งหมด</button>
    <button onclick="filterCategory('จานเดี่ยว')" class="cat-btn bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">จานเดี่ยว</button>
    <button onclick="filterCategory('เครื่องดื่ม')" class="cat-btn bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">เครื่องดื่ม</button>
  </div>

  <!-- Menu Grid -->
  <div id="menu-container" class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
    <!-- รายการอาหารจะสร้างด้วย JS -->
  </div>

  <!-- Cart Bottom Bar -->
  <div id="bottom-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-2xl mx-auto z-20">
    <div>
      <p id="total-qty-text" class="text-xs text-gray-500">รวมทั้งหมด 0 รายการ</p>
      <p id="total-price-text" class="text-xl font-bold text-emerald-600">0 ฿</p>
    </div>
    <button onclick="openCart()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-emerald-700">
      ดูตะกร้าสินค้า 🛒
    </button>
  </div>

  <!-- Cart Modal Drawer -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-4">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h2 class="text-lg font-bold">ตะกร้าของคุณ</h2>
          <button onclick="closeCart()" class="text-gray-500 text-xl font-bold p-1">✕</button>
        </div>

        <div id="cart-items-container" class="space-y-3 max-h-[50vh] overflow-y-auto">
          <!-- รายการในตะกร้า -->
        </div>

        <div class="mt-4">
          <label class="text-xs font-semibold text-gray-600 block mb-1">หมายเหตุเพิ่มเติม (ถ้ามี):</label>
          <textarea id="order-notes" placeholder="เช่น เผ็ดน้อย, แยกน้ำ, ไม่ใส่ผัก" class="w-full border rounded-lg p-2 text-sm" rows="2"></textarea>
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between text-lg font-bold mb-4">
          <span>ยอดชำระสุทธิ:</span>
          <span id="modal-total-price" class="text-emerald-600">0 ฿</span>
        </div>
        <button onclick="sendOrderToLine()" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-center block shadow-md hover:bg-emerald-600">
          ส่งรายการสั่งอาหารไปทาง LINE 🟢
        </button>
      </div>
    </div>
  </div>

  <script>
    const MENU_ITEMS = [
      { id: 1, name: 'กะเพราหมูสับไข่ดาว', category: 'จานเดี่ยว', price: 65, image: 'https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=400' },
      { id: 2, name: 'ข้าวผัดต้มยำกุ้ง', category: 'จานเดี่ยว', price: 89, image: 'https://images.unsplash.com/photo-1559847844-5315695dadae?w=400' },
      { id: 3, name: 'ข้าวหมูกระเทียม', category: 'จานเดี่ยว', price: 60, image: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400' },
      { id: 4, name: 'ชาไทยเย็น', category: 'เครื่องดื่ม', price: 35, image: 'https://images.unsplash.com/photo-1558857563-b371033873b8?w=400' },
      { id: 5, name: 'ชามะนาว', category: 'เครื่องดื่ม', price: 35, image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400' },
    ];

    let cart = {};
    let currentCategory = 'ทั้งหมด';

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      
      const filtered = MENU_ITEMS.filter(item => currentCategory === 'ทั้งหมด' || item.category === currentCategory);
      
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-xl shadow-sm border flex gap-3 items-center';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}" class="w-20 h-20 rounded-lg object-cover">
          <div class="flex-1">
            <h3 class="font-bold text-gray-800">${item.name}</h3>
            <p class="text-emerald-600 font-bold mt-1">${item.price} ฿</p>
          </div>
          <button onclick="addToCart(${item.id})" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-emerald-700">
            + เพิ่ม
          </button>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if(btn.innerText === cat) {
          btn.className = 'cat-btn bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap';
        } else {
          btn.className = 'cat-btn bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap';
        }
      });
      renderMenu();
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateUI();
    }

    function updateQty(id, delta) {
      if (cart[id]) {
        cart[id] += delta;
        if (cart[id] <= 0) delete cart[id];
      }
      updateUI();
    }

    function updateUI() {
      let totalQty = 0;
      let totalPrice = 0;

      for (let id in cart) {
        let item = MENU_ITEMS.find(m => m.id == id);
        if (item) {
          totalQty += cart[id];
          totalPrice += item.price * cart[id];
        }
      }

      // Update Badges & Bottom Bar
      const badge = document.getElementById('cart-count-badge');
      const bottomBar = document.getElementById('bottom-bar');
      
      if (totalQty > 0) {
        badge.innerText = totalQty;
        badge.classList.remove('hidden');
        bottomBar.classList.remove('hidden');
        document.getElementById('total-qty-text').innerText = `รวมทั้งหมด ${totalQty} รายการ`;
        document.getElementById('total-price-text').innerText = `${totalPrice} ฿`;
        document.getElementById('modal-total-price').innerText = `${totalPrice} ฿`;
      } else {
        badge.classList.add('hidden');
        bottomBar.classList.add('hidden');
        closeCart();
      }

      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';

      for (let id in cart) {
        let item = MENU_ITEMS.find(m => m.id == id);
        if (item) {
          let row = document.createElement('div');
          row.className = 'flex justify-between items-center border-b pb-2';
          row.innerHTML = `
            <div>
              <p class="font-semibold">${item.name}</p>
              <p class="text-sm text-gray-500">${item.price * cart[id]} ฿</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateQty(${id}, -1)" class="w-7 h-7 bg-gray-200 rounded-full font-bold">-</button>
              <span>${cart[id]}</span>
              <button onclick="updateQty(${id}, 1)" class="w-7 h-7 bg-emerald-600 text-white rounded-full font-bold">+</button>
            </div>
          `;
          container.appendChild(row);
        }
      }
    }

    function openCart() {
      if (Object.keys(cart).length === 0) {
        alert("กรุณาเลือกรายการอาหารก่อนครับ");
        return;
      }
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function sendOrderToLine() {
      let text = "🛒 *ออเดอร์ใหม่จากหน้าเว็บ*\n\n";
      let total = 0;
      let count = 1;

      for (let id in cart) {
        let item = MENU_ITEMS.find(m => m.id == id);
        if (item) {
          let subtotal = item.price * cart[id];
          total += subtotal;
          text += `${count}. ${item.name} x${cart[id]} = ${subtotal} บาท\n`;
          count++;
        }
      }

      text += `\n💰 *ยอดรวมทั้งหมด: ${total} บาท*`;
      let notes = document.getElementById('order-notes').value;
      if (notes) text += `\n📝 *หมายเหตุ:* ${notes}`;

      window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
    }

    // Init Render
    renderMenu();
  </script>
</body>
</html>
